app:
  security:
    jwt-secret: ${JWT_SECRET}   # sem default: obrigatório fora do profile dev (mín. 32 bytes)

spring:
  autoconfigure:
    # Autenticação é por JWT; evita o usuário/senha gerado no log
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: user-template
  threads:
    virtual:
      enabled: true
  datasource:
    # Defaults = Postgres do docker-compose.yml; em outros ambientes, sobrescreva pelas variáveis
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USERNAME:users}
    password: ${DB_PASSWORD:users}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-template
      auto-offset-reset: earliest   # grupo novo não perde mensagens já publicadas
    # Spans de producer/consumer + propagação do traceparent no header Kafka
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema é do Flyway (db/migration); Hibernate só confere se as entidades batem
      ddl-auto: validate

# OpenTelemetry: traces, métricas e logs via OTLP/HTTP. Default = LGTM do docker-compose.yml.
# O service.name vem de spring.application.name.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 100% em dev; reduza em produção
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
